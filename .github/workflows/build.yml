name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp *.ttf www/ || true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p ~/.fonts
          cp *.ttf ~/.fonts/ || true
          fc-cache -f

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Create Android project
        run: |
          npx cap init "বয়ান সংরক্ষণ" com.bayan.sangraho --web-dir www
          npx cap add android
          npx cap sync android

      - name: Apply app icon
        run: |
          test -f icon.svg
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${s%%:*}; px=${s##*:}
            dir=android/app/src/main/res/mipmap-$d
            rsvg-convert -w $px -h $px icon.svg -o $dir/ic_launcher.png
            cp $dir/ic_launcher.png $dir/ic_launcher_round.png
            cp $dir/ic_launcher.png $dir/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bayan-app
          path: android/app/build/outputs/apk/debug/app-debug.apk