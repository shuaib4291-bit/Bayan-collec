<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>বয়ান সংরক্ষণ</title>
<style>@font-face{font-family:'SolaimanLipi';src:url('SolaimanLipi.ttf')}
:root{--bg:#121212;--card:#1e1e1e;--tx:#eee;--sub:#999;--g:#14301a;--gold:#c9a227;--ttl:#6cc57c}
body.light{--bg:#f4f1e8;--card:#fff;--tx:#222;--sub:#666;--ttl:#1b6b2c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:sans-serif}
.page{display:none;height:100%;flex-direction:column}
.page.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding:14px}
.head{background:var(--g);color:#fff;text-align:center;padding:20px 16px;border-radius:0 0 30px 30px}
.head .bis{color:#f3d27a;font-size:clamp(18px,6vw,28px);white-space:nowrap;line-height:1.6}
.head h1{font-size:34px;margin:8px 0}
.head input{width:100%;padding:14px;border-radius:25px;border:1px solid #ccc;background:#1a1a1a;color:#fff;font-size:16px;margin-top:12px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;border-right:6px solid var(--gold)}
.card h3{color:var(--ttl);font-size:24px;margin-bottom:6px}
.card p{color:var(--sub);line-height:1.8;max-height:3.6em;overflow:hidden}
.card small{color:var(--sub)}
.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;border:0;border-radius:30px;padding:16px 28px;font-size:20px;white-space:nowrap}
.bar{display:flex;gap:6px;padding:10px;background:var(--g);flex-shrink:0}
.bar button{flex:1;padding:12px 2px;border:0;border-radius:12px;background:#fff;color:#14301a;font-size:14px;font-weight:bold;white-space:nowrap}
#body{white-space:pre-wrap;line-height:2.1}
#ttl{color:var(--ttl);font-size:28px}
.box{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.edit input,.edit textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #888;background:var(--card);color:var(--tx);font-size:17px;margin-bottom:10px;font-family:inherit}
.edit textarea{height:55vh}
.delbtn{width:100%;padding:12px;border:0;border-radius:12px;background:#b33;color:#fff;font-size:16px}
</style></head><body>

<div id="p1" class="page on">
 <div class="head"><div class="bis">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
 <h1>বয়ান সংরক্ষণ</h1><div>আপনার বয়ানের ব্যক্তিগত সংগ্রহ</div>
 <input id="q" placeholder="বয়ান খুঁজুন..." oninput="list()"></div>
 <div class="scroll"><p id="cnt" style="margin-bottom:12px"></p><div id="list"></div><div style="height:90px"></div></div>
 <button class="fab" onclick="openEdit(-1)">+ নতুন বয়ান</button>
</div>

<div id="p2" class="page">
 <div class="bar">
  <button onclick="show('p1')">ফিরে যান</button>
  <button onclick="fs(-2)">অ-</button>
  <button onclick="fs(2)">অ+</button>
  <button onclick="openEdit(cur)">সম্পাদনা</button>
  <button onclick="theme()">ডার্কমোড</button>
 </div>
 <div class="scroll">
  <div class="box"><h2 id="ttl"></h2></div>
  <div class="box"><div id="body"></div></div>
 </div>
</div>

<div id="p3" class="page edit">
 <div class="bar">
  <button onclick="show(cur<0?'p1':'p2')">ফিরে যান</button>
  <button onclick="save()">সংরক্ষণ</button>
  <button onclick="theme()">ডার্কমোড</button>
 </div>
 <div class="scroll">
  <input id="et" placeholder="শিরোনাম">
  <textarea id="eb" placeholder="বয়ান লিখুন..."></textarea>
  <button id="db" class="delbtn" onclick="del()">মুছে ফেলুন</button>
 </div>
</div>

<script>
var D=JSON.parse(localStorage.bayans||'[]'),cur=-1,size=+localStorage.size||19;
if(localStorage.light)document.body.classList.add('light');
var bn=function(n){return String(n).replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'[d]})};
function $(i){return document.getElementById(i)}
function show(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on')});$(id).classList.add('on')}
function store(){localStorage.bayans=JSON.stringify(D)}
function list(){
 var k=$('q').value.trim(),h='';
 D.forEach(function(b,i){
  if(k&&(b.t+b.b).indexOf(k)<0)return;
  h+='<div class="card" onclick="view('+i+')"><h3>'+esc(b.t)+'</h3><p>'+esc(b.b.slice(0,120))+'</p><small>'+bn(b.d)+'</small></div>';
 });
 $('list').innerHTML=h;$('cnt').textContent='মোট বয়ান: '+bn(D.length);
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function view(i){cur=i;$('ttl').textContent=D[i].t;$('body').textContent=D[i].b;$('body').style.fontSize=size+'px';show('p2')}
function fs(n){size=Math.max(12,Math.min(40,size+n));localStorage.size=size;$('body').style.fontSize=size+'px'}
function theme(){document.body.classList.toggle('light');localStorage.light=document.body.classList.contains('light')?1:''}
function openEdit(i){cur=i;$('et').value=i<0?'':D[i].t;$('eb').value=i<0?'':D[i].b;$('db').style.display=i<0?'none':'block';show('p3')}
function save(){
 var t=$('et').value.trim(),b=$('eb').value;
 if(!t)return alert('শিরোনাম লিখুন');
 if(cur<0){var n=new Date();D.unshift({t:t,b:b,d:n.getDate()+'/'+(n.getMonth()+1)+'/'+n.getFullYear()});cur=-1;store();list();show('p1')}
 else{D[cur].t=t;D[cur].b=b;store();list();view(cur)}
}
function del(){if(confirm('মুছে ফেলবেন?')){D.splice(cur,1);store();list();show('p1')}}
list();
</script>
</body></html>
