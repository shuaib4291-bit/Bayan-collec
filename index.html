<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>বয়ান সংরক্ষণ</title>
<style>
@font-face{font-family:S;src:url(SolaimanLipi.ttf)}
:root{--bg:#f5f0e6;--c:#fff;--t:#222;--g:#1e5f20;--s:#5a6b7b;--h:#1e5f20}
body.n{--bg:#121212;--c:#1e1e1e;--t:#e8e8e8;--g:#7bc47f;--s:#aaa;--h:#0f2f10}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:S,'Noto Sans Bengali',sans-serif}
.p{display:none;min-height:100vh;padding-bottom:90px}
.on{display:block}
header{background:var(--h);color:#fff;padding:16px;text-align:center;border-radius:0 0 30px 30px;position:relative}
.bis{color:#f5d76e;font-size:26px;margin:4px 0 6px;font-family:'Amiri','Traditional Arabic',serif}
h1{margin:0 0 4px;font-size:34px}
.sub{font-size:18px;margin-bottom:12px;opacity:.9}
.moon{position:absolute;top:8px;right:10px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:20px}
input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:24px;font:inherit;font-size:18px;background:var(--c);color:var(--t)}
textarea{border-radius:12px}
.bar{display:flex;gap:6px;padding:8px;background:var(--h)}
.bar button{flex:1;padding:10px 2px;border:0;border-radius:10px;background:#fff;color:#1e5f20;font:inherit;font-size:16px}
.card{background:var(--c);margin:10px 14px;padding:14px;border-radius:14px;border-right:6px solid #c9a227}
.card b{color:var(--g);font-size:20px}
.card p{color:var(--s);margin:6px 0}
.card small{color:#888}
.box{background:var(--c);margin:10px 14px;padding:14px;border-radius:14px;white-space:pre-wrap;line-height:1.9}
#add{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#c9a227;color:#fff;border:0;border-radius:30px;padding:14px 28px;font:inherit;font-size:20px}
.pad{padding:14px}
.pad>*{margin-bottom:10px}
.r{background:#c62828!important;color:#fff!important}
</style></head><body>

<div id="l" class="p on">
<header>
<button class="moon" onclick="N()">☾</button>
<div class="bis">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
<h1>বয়ান সংরক্ষণ</h1>
<div class="sub">আপনার বয়ানের ব্যক্তিগত সংগ্রহ</div>
<input id="q" placeholder="বয়ান খুঁজুন..." oninput="L()"></header>
<div style="padding:8px 14px" id="cnt"></div>
<div id="list"></div>
<button id="add" onclick="E(-1)">+ নতুন বয়ান</button>
</div>

<div id="v" class="p">
<div class="bar">
<button onclick="go('l')">‹</button>
<button onclick="F(-2)">অ-</button>
<button onclick="F(2)">অ+</button>
<button onclick="E(cur)">সম্পাদনা</button>
<button onclick="N()">☾</button></div>
<div class="box" style="color:var(--g);font-size:22px" id="vt"></div>
<div class="box" id="vx"></div>
</div>

<div id="e" class="p">
<div class="bar"><button onclick="go('l')">‹</button></div>
<div class="pad">
<input id="et" placeholder="শিরোনাম">
<textarea id="ex" rows="14" placeholder="বয়ান লিখুন..."></textarea>
<button class="card" style="width:100%;border:0;font:inherit;font-size:18px" onclick="S()">সংরক্ষণ</button>
<button id="dl" class="card r" style="width:100%;border:0;font:inherit;font-size:18px" onclick="X()">মুছুন</button>
</div></div>

<script>
let D=JSON.parse(localStorage.b||'[]'),cur=-1,fs=+localStorage.f||22;
if(localStorage.n=='1')document.body.classList.add('n');
const $=i=>document.getElementById(i);
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const sv=()=>localStorage.b=JSON.stringify(D);
function go(id){document.querySelectorAll('.p').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');if(id=='l')L()}
function N(){document.body.classList.toggle('n');localStorage.n=document.body.classList.contains('n')?'1':'0'}
function L(){
 let q=$('q').value.trim(),h=$('list');h.innerHTML='';
 $('cnt').textContent='মোট বয়ান: '+bn(D.length);
 D.forEach((b,i)=>{
  if(q&&!(b.t+b.x).includes(q))return;
  let c=document.createElement('div');c.className='card';c.onclick=()=>O(i);
  let t=document.createElement('b');t.textContent=b.t;
  let p=document.createElement('p');p.textContent=b.x.slice(0,80);
  let s=document.createElement('small');s.textContent=b.d;
  c.append(t,p,s);h.append(c);
 });
}
function O(i){cur=i;$('vt').textContent=D[i].t;$('vx').textContent=D[i].x;$('vx').style.fontSize=fs+'px';go('v')}
function F(n){fs=Math.max(14,Math.min(50,fs+n));localStorage.f=fs;$('vx').style.fontSize=fs+'px'}
function E(i){cur=i;$('et').value=i<0?'':D[i].t;$('ex').value=i<0?'':D[i].x;$('dl').style.display=i<0?'none':'block';go('e')}
function S(){
 let t=$('et').value.trim(),x=$('ex').value.trim();
 if(!t&&!x)return;
 let d=new Date(),ds=bn(d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear());
 if(cur<0)D.unshift({t,x,d:ds});else{D[cur].t=t;D[cur].x=x}
 sv();go('l')
}
function X(){if(confirm('এই বয়ানটি মুছে ফেলবেন?')){D.splice(cur,1);sv();go('l')}}
L();
</script></body></html>
